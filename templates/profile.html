<!DOCTYPE html>
<html>
<head>
    <title>My Profile - CampusConnect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f8;
        }

        .navbar {
            background: #2b8a7a;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
        }

        .profile-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: auto;
            background: #2b8a7a;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }

        .profile-card h2 {
            margin-bottom: 5px;
        }

        .email {
            color: #777;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            padding: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .stat strong {
            display: block;
            font-size: 24px;
            color: #2b8a7a;
        }

        .stat span {
            color: #666;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            background: #2b8a7a;
            color: white;
            padding: 10px 20px;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>CampusConnect 🎓</h1>
    </div>

    <div class="profile-container">

        <div class="profile-card">

            <div class="avatar">
                {{ profile_user.username|first|upper }}
            </div>

            <h2>{{ profile_user.username }}</h2>

            <p class="email">
                {{ profile_user.email }}
            </p>

            <div class="stats">

                <div class="stat">
                    <strong>{{ posts_count }}</strong>
                    <span>Posts</span>
                </div>

                <div class="stat">
                    <strong>{{ followers_count }}</strong>
                    <span>Followers</span>
                </div>

                <div class="stat">
                    <strong>{{ following_count }}</strong>
                    <span>Following</span>
                </div>

            </div>

            <a href="/home/" class="back-btn">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
