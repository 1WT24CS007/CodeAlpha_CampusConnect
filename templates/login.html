<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f8;
        }

        .navbar {
            background: #2b8a7a;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 420px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }

        .login-card h2 {
            color: #2b8a7a;
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .input-box:focus {
            outline: none;
            border-color: #2b8a7a;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2b8a7a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .register-text {
            margin-top: 20px;
            color: #666;
        }

        .register-link {
            color: #2b8a7a;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>CampusConnect 🎓</h1>
    </div>

    <div class="container">

        <div class="login-card">

            <h2>Welcome Back 👋</h2>

            <form method="POST">
                {% csrf_token %}

                <input
                    type="text"
                    name="username"
                    class="input-box"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    class="input-box"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="login-btn">
                    Login
                </button>
            </form>

            <p class="register-text">
                Don't have an account?
                <a href="/register/" class="register-link">
                    Register here
                </a>
            </p>

        </div>

    </div>

</body>
</html>
