<!DOCTYPE html>
<html>
<head>
    <title>Joined Successfully - CampusConnect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f8;
        }

        .navbar {
            background: #2b8a7a;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .success-card {
            background: white;
            padding: 45px 35px;
            border-radius: 15px;
            text-align: center;
        }

        .success-icon {
            font-size: 65px;
        }

        .success-title {
            color: #2b8a7a;
            margin-top: 15px;
        }

        .club-name {
            color: #333;
        }

        .message {
            color: #666;
            font-size: 16px;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            background: #2b8a7a;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 7px;
            margin: 8px;
            font-weight: bold;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>CampusConnect 🎓</h1>
    </div>

    <div class="container">

        <div class="success-card">

            <div class="success-icon">🎉</div>

            <h1 class="success-title">
                Successfully Joined!
            </h1>

            <h2 class="club-name">
                Welcome to the {{ club_name }}!
            </h2>

            <p class="message">
                You have successfully registered for the
                {{ club_name }}.
            </p>

            <a href="/clubs/" class="btn">
                ← Back to Clubs
            </a>

            <a href="/home/" class="btn">
                🏠 Back to Home
            </a>

        </div>

    </div>

</body>
</html>
