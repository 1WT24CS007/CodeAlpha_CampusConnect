<!DOCTYPE html>
<html>
<head>
    <title>Join Literary Club - CampusConnect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f8;
        }

        .navbar {
            background: #2b8a7a;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
        }

        .club-icon {
            text-align: center;
            font-size: 50px;
        }

        .title {
            text-align: center;
            color: #2b8a7a;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2b8a7a;
        }

        .join-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2b8a7a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .join-btn:hover {
            opacity: 0.9;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2b8a7a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>CampusConnect 🎓</h1>
    </div>

    <div class="container">

        <div class="form-card">

            <div class="club-icon">📚</div>

            <h1 class="title">Join Literary Club</h1>

            <p class="subtitle">
                Register to become a member of the Literary Club.
            </p>

            <form method="POST">
                {% csrf_token %}

                <label>Name:</label>
                <input type="text" name="name" required>

                <br><br>

                <label>Department:</label>
                <input type="text" name="department" required>

                <br><br>

                <label>Year:</label>
                <input type="text" name="year" required>

                <button type="submit" class="join-btn">
                    📚 Join Club
                </button>
            </form>

            <a href="/literary/" class="back-btn">
                ← Back to Literary Club
            </a>

        </div>

    </div>

</body>
</html>
